[[TI Manager] - Purge expired manual entries]
action.email.useNSSubject = 1
action.keyindicator.invert = 0
action.makestreams.param.verbose = 0
action.nbtstat.param.verbose = 0
action.notable.param.verbose = 0
action.nslookup.param.verbose = 0
action.ping.param.verbose = 0
action.risk.forceCsvResults = 1
action.risk.param.verbose = 0
action.send2uba.param.verbose = 0
action.ssg_mobile_alert.passSystemAuth = 1
action.threat_add.param.verbose = 0
action.webhook.enable_allowlist = 0
alert.track = 0
cron_schedule = 3-59/5 * * * *
description = This scheduled report removes expired entries from the manual_denylist and the manual_allowlist KV-Stores
dispatch.earliest_time = -5m
dispatch.latest_time = now
display.general.timeRangePicker.show = 0
display.visualizations.custom.mitre_attck_heatmap.mitre_attck_heatmap.animate = 1
display.visualizations.custom.mitre_attck_heatmap.mitre_attck_heatmap.hideNull = 0
display.visualizations.custom.mitre_attck_heatmap.mitre_attck_heatmap.showSubTechniques = 1
enableSched = 1
search = | inputlookup manual_denylist\
| eval expiration=strptime(expirydate, "%Y-%m-%dT%H:%M:%S.%3NZ")\
| eval now=now()\
| where now<expiration OR isnull(expiration)\
| table expirydate ip reason source target timestamp user\
| outputlookup manual_denylist\
| search 0\
| inputlookup append=t manual_allowlist\
| eval expiration=strptime(expirydate, "%Y-%m-%dT%H:%M:%S.%3NZ")\
| eval now=now()\
| where now<expiration OR isnull(expiration)\
| table expirydate ip reason source target timestamp user\
| outputlookup manual_allowlist